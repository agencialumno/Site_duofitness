<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Duo Fitness | Leads</title>
  <link rel="stylesheet" href="https://use.typekit.net/mda3ytr.css" />
  <link rel="stylesheet" href="leads.css" />
</head>
<body>

<header id="leads-header">
  <h1>Leads da <em>Landing Page</em></h1>
  <p id="leads-total"></p>
</header>

<main id="leads-main">
  <p id="leads-status">Carregando...</p>

  <div id="leads-tabela-wrapper">
    <table id="leads-tabela">
      <thead>
        <tr>
          <th>Data</th>
          <th>Nome</th>
          <th>WhatsApp</th>
          <th>E-mail</th>
          <th>Cidade/Estado</th>
          <th>Capital</th>
          <th>Operação pessoal</th>
          <th>Mesma cidade</th>
        </tr>
      </thead>
      <tbody id="leads-tbody"></tbody>
    </table>
  </div>
</main>

<script type="module" src="leads.js"></script>
</body>
</html>
